<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="auth-card">
    <div class="auth-header">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-label="Auth logo">
        <rect width="40" height="40" rx="10" fill="var(--color-primary)"/>
        <path d="M20 10a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-9 20c0-4.418 4.03-8 9-8s9 3.582 9 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <h1>Create account</h1>
      <p>Join us today — it's free</p>
    </div>
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="regName">Full name</label>
        <input type="text" id="regName" placeholder="Samuel" autocomplete="name" required />
        <span class="field-error" id="regNameErr"></span>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required />
        <span class="field-error" id="regEmailErr"></span>
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="regPassword" placeholder="Min. 6 characters" autocomplete="new-password" required />
          <button type="button" class="eye-btn" data-target="regPassword" aria-label="Toggle password">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <span class="strength-label" id="strengthLabel"></span>
        <span class="field-error" id="regPasswordErr"></span>
      </div>
      <div class="field">
        <label for="regConfirm">Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="regConfirm" placeholder="Re-enter password" autocomplete="new-password" required />
          <button type="button" class="eye-btn" data-target="regConfirm" aria-label="Toggle password">👁</button>
        </div>
        <span class="field-error" id="regConfirmErr"></span>
      </div>
      <button type="submit" class="btn-primary" id="registerBtn">Create account</button>
    </form>
    <div class="divider"><span>or continue with</span></div>
    <div class="social-row">
      <button class="btn-social" data-social="Google">🌐 Google</button>
      <button class="btn-social" data-social="GitHub">🐙 GitHub</button>
    </div>
    <p class="switch-link">Already have an account? <a href="index.html">Sign in</a></p>
  </div>
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script>
    if (localStorage.getItem('auth_user')) window.location.href = 'dashboard.html';

    document.getElementById('regPassword').addEventListener('input', function() {
      const val = this.value;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong ✓'];
      const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e'];
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      fill.style.width = (score * 25) + '%';
      fill.style.background = colors[score] || 'transparent';
      label.textContent = labels[score] || '';
      label.style.color = colors[score] || '';
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      let ok = true;
      clearErrors();
      if (name.length < 2) { showError('regNameErr', 'Please enter your full name.'); ok = false; }
      if (!validEmail(email)) { showError('regEmailErr', 'Please enter a valid email.'); ok = false; }
      if (pass.length < 6) { showError('regPasswordErr', 'Password must be at least 6 characters.'); ok = false; }
      if (pass !== confirm) { showError('regConfirmErr', 'Passwords do not match.'); ok = false; }
      if (!ok) return;
      const users = getUsers();
      if (users.find(u => u.email === email)) { showError('regEmailErr', 'This email is already registered.'); return; }
      const btn = document.getElementById('registerBtn');
      setLoading(btn, true);
      setTimeout(() => {
        const user = { name, email, password: pass, joined: new Date().toLocaleDateString() };
        users.push(user);
        saveUsers(users);
        localStorage.setItem('auth_user', JSON.stringify(user));
        showToast('Account created! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }, 1200);
    });

    document.querySelectorAll('.btn-social').forEach(btn => {
      btn.addEventListener('click', () => showToast(`${btn.dataset.social} sign-in coming soon!`, 'info'));
    });
  </script>
</body>
</html>
