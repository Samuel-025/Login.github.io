<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthFlow — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mesh" aria-hidden="true"><div class="blob"></div></div>
<button class="theme-btn" id="themeBtn" aria-label="Switch to light mode">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor" opacity="0.12"/>
      <path d="M16 7 L22 11 L22 17 C22 21 16 25 16 25 C16 25 10 21 10 17 L10 11 Z" fill="currentColor" opacity="0.9"/>
      <path d="M13 17 L15.5 19.5 L20 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-name">AuthFlow</span>
  </div>

  <h1 class="ptitle">Create account</h1>
  <p class="psub">Join today — it only takes a minute</p>

  <form id="regForm" novalidate>
    <div class="fg" id="rn-g">
      <label class="fl" for="rn">Full name</label>
      <div class="iw">
        <i class="bx bx-user ic" aria-hidden="true"></i>
        <input type="text" id="rn" placeholder="Jane Doe" autocomplete="name" required>
      </div>
      <div class="ferr" id="rn-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <div class="fg" id="re-g">
      <label class="fl" for="re">Email</label>
      <div class="iw">
        <i class="bx bx-envelope ic" aria-hidden="true"></i>
        <input type="email" id="re" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="ferr" id="re-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <div class="fg" id="rp-g">
      <label class="fl" for="rp">Password</label>
      <div class="iw">
        <i class="bx bx-lock-alt ic" aria-hidden="true"></i>
        <input type="password" id="rp" placeholder="Min 8 characters" autocomplete="new-password" required oninput="strengthMeter(this.value)">
        <button type="button" class="pw-eye" onclick="toggleEye('rp',this)" aria-label="Show password"><i class="bx bx-show"></i></button>
      </div>
      <div class="ferr" id="rp-e"><i class="bx bx-error-circle"></i><span></span></div>
      <div class="str-wrap">
        <div class="str-bar"><div class="str-fill" id="sfill"></div></div>
        <span class="str-lbl" id="slbl">Enter a password</span>
      </div>
    </div>
    <div class="fg" id="rc-g">
      <label class="fl" for="rc">Confirm password</label>
      <div class="iw">
        <i class="bx bx-lock-open-alt ic" aria-hidden="true"></i>
        <input type="password" id="rc" placeholder="Repeat password" autocomplete="new-password" required>
        <button type="button" class="pw-eye" onclick="toggleEye('rc',this)" aria-label="Show password"><i class="bx bx-show"></i></button>
      </div>
      <div class="ferr" id="rc-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <div class="fg" id="rph-g">
      <label class="fl" for="rph">Phone <span class="optional">(optional)</span></label>
      <div class="iw">
        <i class="bx bx-phone ic" aria-hidden="true"></i>
        <input type="tel" id="rph" placeholder="+91 9876543210" autocomplete="tel">
      </div>
      <div class="ferr" id="rph-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <label class="ck terms-ck" id="terms-g">
      <input type="checkbox" id="terms" required>
      <span>I agree to the <a href="#" onclick="return false">Terms of Service</a> and <a href="#" onclick="return false">Privacy Policy</a></span>
    </label>
    <div class="ferr" id="terms-e" style="margin-bottom:var(--space-4)"><i class="bx bx-error-circle"></i><span></span></div>
    <button type="submit" class="btn-p" id="rBtn"><span class="lbl">Create account</span><div class="spin" aria-hidden="true"></div></button>
  </form>
  <div class="sw">Already have an account? <a href="index.html">Sign in</a></div>
</div>

<div class="toast" id="toastEl" role="status" aria-live="polite">
  <i class="bx bx-check-circle" id="toastIco"></i>
  <span id="toastMsg"></span>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  let ok = true;
  const name  = document.getElementById('rn').value.trim();
  const email = document.getElementById('re').value.trim();
  const pw    = document.getElementById('rp').value;
  const cf    = document.getElementById('rc').value;
  const phone = document.getElementById('rph').value.trim();
  const terms = document.getElementById('terms').checked;
  ['rn-g','re-g','rp-g','rc-g','rph-g'].forEach(g => clearErr(g, g.replace('-g','-e')));
  document.getElementById('terms-e').classList.remove('show');
  if (!name)  { setErr('rn-g','rn-e','Full name is required'); ok=false; }
  if (!email) { setErr('re-g','re-e','Email is required'); ok=false; }
  else if (!validEmail(email)) { setErr('re-g','re-e','Enter a valid email address'); ok=false; }
  if (!pw)    { setErr('rp-g','rp-e','Password is required'); ok=false; }
  else if (pw.length < 8) { setErr('rp-g','rp-e','Minimum 8 characters'); ok=false; }
  if (!cf)    { setErr('rc-g','rc-e','Please confirm your password'); ok=false; }
  else if (pw !== cf) { setErr('rc-g','rc-e','Passwords do not match'); ok=false; }
  if (phone && !/^[+\d][\d\s\-]{6,14}$/.test(phone)) { setErr('rph-g','rph-e','Enter a valid phone number'); ok=false; }
  if (!terms) {
    const el = document.getElementById('terms-e');
    el.querySelector('span').textContent = 'You must agree to the terms';
    el.classList.add('show'); ok=false;
  }
  if (!ok) return;
  await btnLoad(document.getElementById('rBtn'));
  const users = getUsers();
  if (users[email]) { setErr('re-g','re-e','An account with this email already exists'); return; }
  users[email] = { name, email, pw, phone, joined: new Date().toLocaleDateString('en-IN') };
  saveUsers(users);
  showToast('Account created! 🎉 Please sign in.','success');
  setTimeout(() => window.location.href = 'index.html', 1600);
});
</script>
</body>
</html>
