<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="auth-card" style="text-align:center;padding:var(--space-16) var(--space-8)">
    <div style="font-size:4rem;margin-bottom:var(--space-4)">🔍</div>
    <h1 style="font-size:var(--text-2xl);margin-bottom:var(--space-2)">404</h1>
    <p style="color:var(--color-text-muted);margin-bottom:var(--space-8)">This page doesn't exist or was moved.</p>
    <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;">← Back to login</a>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
