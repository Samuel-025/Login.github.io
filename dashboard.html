<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-page">
  <header class="dash-header">
    <div class="dash-logo">
      <svg viewBox="0 0 40 40" fill="none" aria-label="Auth logo" width="32" height="32">
        <rect width="40" height="40" rx="10" fill="var(--color-primary)"/>
        <path d="M20 10a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-9 20c0-4.418 4.03-8 9-8s9 3.582 9 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>Auth</span>
    </div>
    <div class="dash-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
      <button class="btn-outline" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <main class="dash-main">
    <section class="dash-welcome">
      <div class="avatar" id="dashAvatar">S</div>
      <div>
        <h1 id="dashName">Samuel</h1>
        <p id="dashEmail" class="muted">user@example.com</p>
        <p class="muted" id="dashJoined"></p>
      </div>
    </section>
    <section class="dash-cards">
      <div class="dash-card">
        <span class="card-icon">🔐</span>
        <h3>Security</h3>
        <p>Your account is protected. Last sign-in was just now.</p>
      </div>
      <div class="dash-card">
        <span class="card-icon">📧</span>
        <h3>Email verified</h3>
        <p>Your email address has been confirmed.</p>
      </div>
      <div class="dash-card">
        <span class="card-icon">⚙️</span>
        <h3>Settings</h3>
        <p>Manage your preferences and notifications below.</p>
      </div>
    </section>
    <section class="dash-profile">
      <h2>Edit profile</h2>
      <form id="profileForm" novalidate>
        <div class="field">
          <label for="profileName">Full name</label>
          <input type="text" id="profileName" placeholder="Your name" />
          <span class="field-error" id="profileNameErr"></span>
        </div>
        <div class="field">
          <label for="profilePhone">Phone (optional)</label>
          <input type="tel" id="profilePhone" placeholder="+91 98765 43210" />
        </div>
        <button type="submit" class="btn-primary" id="saveBtn">Save changes</button>
      </form>
    </section>
  </main>
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script>
    const raw = localStorage.getItem('auth_user');
    if (!raw) window.location.href = 'index.html';
    const user = JSON.parse(raw);
    document.getElementById('dashName').textContent = user.name || 'User';
    document.getElementById('dashEmail').textContent = user.email;
    document.getElementById('dashAvatar').textContent = (user.name || 'U')[0].toUpperCase();
    document.getElementById('profileName').value = user.name || '';
    document.getElementById('profilePhone').value = user.phone || '';
    if (user.joined) document.getElementById('dashJoined').textContent = 'Joined ' + user.joined;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('auth_user');
      sessionStorage.removeItem('auth_user');
      showToast('Signed out. Goodbye!', 'info');
      setTimeout(() => window.location.href = 'index.html', 900);
    });

    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('profileName').value.trim();
      const phone = document.getElementById('profilePhone').value.trim();
      clearErrors();
      if (name.length < 2) { showError('profileNameErr', 'Name must be at least 2 characters.'); return; }
      const btn = document.getElementById('saveBtn');
      setLoading(btn, true);
      setTimeout(() => {
        const updated = { ...user, name, phone };
        localStorage.setItem('auth_user', JSON.stringify(updated));
        const users = getUsers();
        const idx = users.findIndex(u => u.email === user.email);
        if (idx > -1) { users[idx] = updated; saveUsers(users); }
        document.getElementById('dashName').textContent = name;
        document.getElementById('dashAvatar').textContent = name[0].toUpperCase();
        setLoading(btn, false);
        showToast('Profile updated!', 'success');
      }, 900);
    });
  </script>
</body>
</html>
