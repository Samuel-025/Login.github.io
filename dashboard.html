<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthFlow — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mesh" aria-hidden="true"><div class="blob"></div></div>
<button class="theme-btn" id="themeBtn" aria-label="Switch to light mode">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card card-wide">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor" opacity="0.12"/>
      <path d="M16 7 L22 11 L22 17 C22 21 16 25 16 25 C16 25 10 21 10 17 L10 11 Z" fill="currentColor" opacity="0.9"/>
      <path d="M13 17 L15.5 19.5 L20 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-name">AuthFlow</span>
  </div>

  <div class="dash-hero">
    <div class="dash-avatar" id="dashAvatar"><i class="bx bx-user"></i></div>
    <div>
      <h1 class="ptitle" id="dashName">Loading…</h1>
      <p class="psub" style="margin-bottom:0" id="dashEmail">—</p>
    </div>
  </div>

  <div class="dash-grid">
    <div class="dc">
      <i class="bx bx-calendar-check dc-icon"></i>
      <div class="dc-val" id="dashJoined">—</div>
      <div class="dc-lbl">Member since</div>
    </div>
    <div class="dc">
      <i class="bx bx-shield-check dc-icon"></i>
      <div class="dc-val">Active</div>
      <div class="dc-lbl">Account status</div>
    </div>
    <div class="dc">
      <i class="bx bx-log-in dc-icon"></i>
      <div class="dc-val" id="dashTime">—</div>
      <div class="dc-lbl">Last login</div>
    </div>
    <div class="dc">
      <i class="bx bx-phone dc-icon"></i>
      <div class="dc-val" id="dashPhone">—</div>
      <div class="dc-lbl">Phone</div>
    </div>
  </div>

  <div class="dash-actions">
    <button class="btn-action" onclick="showToast('Profile editing coming soon','info')"><i class="bx bx-edit"></i> Edit profile</button>
    <button class="btn-action" onclick="showToast('Settings coming soon','info')"><i class="bx bx-cog"></i> Settings</button>
    <button class="btn-action btn-danger" onclick="logout()"><i class="bx bx-log-out"></i> Sign out</button>
  </div>
</div>

<div class="toast" id="toastEl" role="status" aria-live="polite">
  <i class="bx bx-check-circle" id="toastIco"></i>
  <span id="toastMsg"></span>
</div>

<script src="js/app.js"></script>
<script>
(function() {
  const user = getSession();
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('dashName').textContent = 'Hello, ' + user.name + '!';
  document.getElementById('dashEmail').textContent = user.email;
  document.getElementById('dashJoined').textContent = user.joined || 'Today';
  document.getElementById('dashPhone').textContent = user.phone || 'Not set';
  document.getElementById('dashTime').textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const initials = user.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const av = document.getElementById('dashAvatar');
  av.innerHTML = '';
  av.textContent = initials;
})();

function logout() {
  clearSession();
  showToast('Signed out','info');
  setTimeout(() => window.location.href = 'index.html', 900);
}
</script>
</body>
</html>
