<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="auth-card">
    <div class="auth-header">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-label="Auth logo">
        <rect width="40" height="40" rx="10" fill="var(--color-primary)"/>
        <path d="M20 10a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-9 20c0-4.418 4.03-8 9-8s9 3.582 9 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <h1>Welcome back</h1>
      <p>Sign in to your account</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
        <span class="field-error" id="loginEmailErr"></span>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="eye-btn" data-target="loginPassword" aria-label="Toggle password">👁</button>
        </div>
        <span class="field-error" id="loginPasswordErr"></span>
      </div>
      <div class="row-between">
        <label class="check-label"><input type="checkbox" id="rememberMe"> Remember me</label>
        <a href="forgot.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    </form>
    <div class="divider"><span>or continue with</span></div>
    <div class="social-row">
      <button class="btn-social" data-social="Google">🌐 Google</button>
      <button class="btn-social" data-social="GitHub">🐙 GitHub</button>
    </div>
    <p class="switch-link">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('auth_user')) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      let ok = true;
      clearErrors();
      if (!validEmail(email)) { showError('loginEmailErr', 'Please enter a valid email.'); ok = false; }
      if (pass.length < 6) { showError('loginPasswordErr', 'Password must be at least 6 characters.'); ok = false; }
      if (!ok) return;
      const btn = document.getElementById('loginBtn');
      setLoading(btn, true);
      setTimeout(() => {
        const users = getUsers();
        const user = users.find(u => u.email === email && u.password === pass);
        if (!user) {
          setLoading(btn, false);
          showError('loginPasswordErr', 'Invalid email or password.');
          return;
        }
        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('auth_user', JSON.stringify(user));
        } else {
          sessionStorage.setItem('auth_user', JSON.stringify(user));
          localStorage.setItem('auth_user', JSON.stringify(user));
        }
        showToast('Signed in successfully! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }, 1200);
    });

    document.querySelectorAll('.btn-social').forEach(btn => {
      btn.addEventListener('click', () => showToast(`${btn.dataset.social} sign-in coming soon!`, 'info'));
    });
  </script>
</body>
</html>
