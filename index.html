<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthFlow — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mesh" aria-hidden="true"><div class="blob"></div></div>
<button class="theme-btn" id="themeBtn" aria-label="Switch to light mode">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor" opacity="0.12"/>
      <path d="M16 7 L22 11 L22 17 C22 21 16 25 16 25 C16 25 10 21 10 17 L10 11 Z" fill="currentColor" opacity="0.9"/>
      <path d="M13 17 L15.5 19.5 L20 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-name">AuthFlow</span>
  </div>

  <h1 class="ptitle">Welcome back</h1>
  <p class="psub">Sign in to your account</p>

  <div class="socials">
    <button class="btn-s" type="button" onclick="showToast('Demo: Google sign-in','info')">
      <img src="https://cdn.simpleicons.org/google" alt="Google" width="18" height="18" loading="lazy"> Google
    </button>
    <button class="btn-s" type="button" onclick="showToast('Demo: GitHub sign-in','info')">
      <img src="https://cdn.simpleicons.org/github" alt="GitHub" width="18" height="18" loading="lazy"> GitHub
    </button>
  </div>
  <div class="divider">or with email</div>

  <form id="loginForm" novalidate>
    <div class="fg" id="le-g">
      <label class="fl" for="le">Email</label>
      <div class="iw">
        <i class="bx bx-envelope ic" aria-hidden="true"></i>
        <input type="email" id="le" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="ferr" id="le-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <div class="fg" id="lp-g">
      <label class="fl" for="lp">Password</label>
      <div class="iw">
        <i class="bx bx-lock-alt ic" aria-hidden="true"></i>
        <input type="password" id="lp" placeholder="Your password" autocomplete="current-password" required>
        <button type="button" class="pw-eye" onclick="toggleEye('lp',this)" aria-label="Show password"><i class="bx bx-show"></i></button>
      </div>
      <div class="ferr" id="lp-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <div class="meta">
      <label class="ck"><input type="checkbox" id="remember"> Remember me</label>
      <a href="forgot.html" class="lsm">Forgot password?</a>
    </div>
    <button type="submit" class="btn-p" id="lBtn"><span class="lbl">Sign in</span><div class="spin" aria-hidden="true"></div></button>
  </form>
  <div class="sw">No account? <a href="register.html">Sign up</a></div>
</div>

<div class="toast" id="toastEl" role="status" aria-live="polite">
  <i class="bx bx-check-circle" id="toastIco"></i>
  <span id="toastMsg"></span>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  let ok = true;
  const email = document.getElementById('le').value.trim();
  const pw = document.getElementById('lp').value;
  clearErr('le-g','le-e'); clearErr('lp-g','lp-e');
  if (!email) { setErr('le-g','le-e','Email is required'); ok=false; }
  else if (!validEmail(email)) { setErr('le-g','le-e','Enter a valid email address'); ok=false; }
  if (!pw) { setErr('lp-g','lp-e','Password is required'); ok=false; }
  if (!ok) return;
  await btnLoad(document.getElementById('lBtn'));
  const users = getUsers();
  if (!users[email]) { setErr('le-g','le-e','No account found. Please sign up first.'); return; }
  if (users[email].pw !== pw) { setErr('lp-g','lp-e','Incorrect password'); return; }
  setSession(users[email]);
  showToast('Signed in! Redirecting…','success');
  setTimeout(() => window.location.href = 'dashboard.html', 1200);
});

document.getElementById('le').addEventListener('blur', function(){
  if (this.value && !validEmail(this.value)) setErr('le-g','le-e','Enter a valid email address');
  else clearErr('le-g','le-e');
});
</script>
</body>
</html>
