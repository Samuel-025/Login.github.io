<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="auth-card">
    <div class="auth-header">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-label="Auth logo">
        <rect width="40" height="40" rx="10" fill="var(--color-primary)"/>
        <path d="M20 10a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-9 20c0-4.418 4.03-8 9-8s9 3.582 9 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <h1>Reset password</h1>
      <p>We'll send a link to your inbox</p>
    </div>
    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" required />
        <span class="field-error" id="forgotEmailErr"></span>
      </div>
      <button type="submit" class="btn-primary" id="forgotBtn">Send reset link</button>
    </form>
    <p class="switch-link"><a href="index.html">← Back to sign in</a></p>
  </div>
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      clearErrors();
      if (!validEmail(email)) { showError('forgotEmailErr', 'Please enter a valid email.'); return; }
      const users = getUsers();
      const btn = document.getElementById('forgotBtn');
      setLoading(btn, true);
      setTimeout(() => {
        setLoading(btn, false);
        if (!users.find(u => u.email === email)) {
          showError('forgotEmailErr', 'No account found with this email.');
          return;
        }
        showToast('Reset link sent! Check your inbox.', 'success');
        document.getElementById('forgotForm').reset();
      }, 1200);
    });
  </script>
</body>
</html>
