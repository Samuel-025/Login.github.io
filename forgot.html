<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthFlow — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mesh" aria-hidden="true"><div class="blob"></div></div>
<button class="theme-btn" id="themeBtn" aria-label="Switch to light mode">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor" opacity="0.12"/>
      <path d="M16 7 L22 11 L22 17 C22 21 16 25 16 25 C16 25 10 21 10 17 L10 11 Z" fill="currentColor" opacity="0.9"/>
      <path d="M13 17 L15.5 19.5 L20 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-name">AuthFlow</span>
  </div>

  <a href="index.html" class="back-btn"><i class="bx bx-arrow-back"></i> Back to sign in</a>
  <h1 class="ptitle">Reset password</h1>
  <p class="psub">Enter your email and we'll send a reset link</p>

  <div id="sentView" style="display:none;text-align:center;padding:var(--space-8) 0">
    <div style="font-size:3rem;margin-bottom:var(--space-4)">📬</div>
    <h2 style="font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-2)">Check your inbox</h2>
    <p style="color:var(--text-m);font-size:var(--text-sm);margin-bottom:var(--space-6)">A reset link has been sent to <strong id="sentEmail"></strong></p>
    <a href="index.html" class="btn-p" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Back to sign in</a>
  </div>

  <form id="fgtForm" novalidate>
    <div class="fg" id="fe-g">
      <label class="fl" for="fe">Email address</label>
      <div class="iw">
        <i class="bx bx-envelope ic" aria-hidden="true"></i>
        <input type="email" id="fe" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="ferr" id="fe-e"><i class="bx bx-error-circle"></i><span></span></div>
    </div>
    <button type="submit" class="btn-p" id="fBtn"><span class="lbl">Send reset link</span><div class="spin" aria-hidden="true"></div></button>
  </form>
  <div class="sw">Remember it? <a href="index.html">Sign in</a></div>
</div>

<div class="toast" id="toastEl" role="status" aria-live="polite">
  <i class="bx bx-check-circle" id="toastIco"></i>
  <span id="toastMsg"></span>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('fgtForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('fe').value.trim();
  clearErr('fe-g','fe-e');
  if (!email) { setErr('fe-g','fe-e','Email is required'); return; }
  if (!validEmail(email)) { setErr('fe-g','fe-e','Enter a valid email address'); return; }
  await btnLoad(document.getElementById('fBtn'));
  document.getElementById('sentEmail').textContent = email;
  document.getElementById('fgtForm').style.display = 'none';
  document.querySelector('.sw').style.display = 'none';
  document.getElementById('sentView').style.display = 'block';
});
</script>
</body>
</html>
